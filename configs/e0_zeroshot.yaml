experiment:
  id: "E0_zeroshot"
  description: "Baseline evaluation of zero-shot DeBERTa-v3 and MiniLM before LoRA adaptation."
  seed: 42

model:
  ner_engine:
    name: "yonigo/deberta-v3-base-pii-en"
    task: "token-classification"
    quantization: null
    adapter: null  # Explicitly null because this is the baseline
  
  router_engine:
    name: "sentence-transformers/all-MiniLM-L6-v2"
    task: "feature-extraction"
    vector_dim: 384
    distance_metric: "cosine_similarity" # FAISS IndexFlatIP
    threshold: 0.60

data:
  dataset_name: "ner_dataset"
  split: "test" # The subset used for evaluation
  max_seq_length: 512

infer:
  batch_size: 16
  device: "cuda" # Updated to CUDA for PyTorch inference

eval:
  metrics: ["seqeval", "hit_rate"]
  target_entities: ["B-PII", "I-PII"]